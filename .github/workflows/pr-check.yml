name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  file-size-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check file sizes
        run: |
          echo "Checking files larger than 1 MB..."

          oversized=0

          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              size=$(stat -c%s "$file")

              if [ "$size" -gt 1048576 ]; then
                echo "FAIL: $file is larger than 1 MB ($size bytes)"
                oversized=1
              fi
            fi
          done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")

          if [ "$oversized" -eq 1 ]; then
            exit 1
          fi

          echo "All changed files are under 1 MB."

  branch-name-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" =~ ^(feature|test|docs)/.+$ ]]; then
            echo "Branch name is valid."
          else
            echo "Invalid branch name."
            echo "Use feature/*, test/*, or docs/*"
            exit 1
          fi

  pr-body-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "::warning::PR description is empty."
          else
            echo "PR description is present."
          fi