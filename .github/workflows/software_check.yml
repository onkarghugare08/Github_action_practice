name: Runner Software Check

on:
  workflow_dispatch:

jobs:
  check-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Docker version
        run: docker --version

      - name: Python version
        run: python3 --version

      - name: Node version
        run: node --version

      - name: Git version
        run: git --version

      - name: System information
        run: |
          echo "Hostname: $(hostname)"
          echo "OS:"
          cat /etc/os-release
