name: PR Check

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Print PR branch
        run: |
          echo "PR check running for branch: ${{ github.head_ref }}"
