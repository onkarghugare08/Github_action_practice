name: Scheduled Health Check

on:
  #schedule:
   # - cron: 0 0 1 * *

  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/mypython:latest

      - name: Run container
        run: |
          docker run -d \
            --name day48-health \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/mypython:latest

      - name: Wait for application
        run: |
          sleep 5

      - name: Health check
        id: health
        run: |
          if curl -f http://localhost:5000/health; then
            echo "Health check PASSED"
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "Health check FAILED"
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create summary
        if: always()
        run: |
          echo "## Health Check Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ secrets.DOCKER_USERNAME }}/day48-app:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ steps.health.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop container
        if: always()
        run: |
          docker stop day48-health || true
          docker rm day48-health || true
